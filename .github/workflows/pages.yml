# GitHub Pages for the GitHub mirror (github.com/Adrient-tech/Adrient-Workspace).
#
# Publishes the static product/docs site in web/app/public/docs — the same pages
# workspace.adrient.com serves at /docs — to https://adrient.com/docs/adrient-workspace.
# Forgejo runners only run .forgejo/workflows, so this file runs only on GitHub.
name: pages

on:
  push:
    branches: [main]
    paths:
      - web/app/public/docs/**
      - web/app/public/favicon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/app/public/docs/. _site/
          cp web/app/public/favicon.svg _site/
          touch _site/.nojekyll
          # The pages are written for workspace.adrient.com, where they live under /docs.
          # Pages serves them from /adrient/, so make root-absolute links relative.
          sed -i -E \
            -e 's#href="/docs/([^"]*)"#href="\1"#g' \
            -e 's#href="/docs\#([^"]*)"#href="index.html\#\1"#g' \
            -e 's#href="/docs"#href="index.html"#g' \
            -e 's#(href|src)="/favicon\.svg"#\1="favicon.svg"#g' \
            _site/*.html
          if grep -nE '(href|src)="/[^/]' _site/*.html; then
            echo "::error::root-absolute links remain (they would 404 under /adrient/)"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
