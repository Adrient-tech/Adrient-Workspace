# Adrient Workspace: production stack (single server).
#
# Normally driven by /install.sh, which writes the .env this file reads.
# Only Caddy publishes ports (80/443). Everything else lives on the internal
# compose network; Zitadel also binds 127.0.0.1 only so the installer can
# provision it. Optional services use profiles:
#
#   docker compose --env-file .env up -d                           # core
#   docker compose --env-file .env --profile crm --profile git up -d
#
# Required .env variables (generated by install.sh): ADRIENT_DOMAIN, the
# *_HOST names, POSTGRES_PASSWORD, ZITADEL_MASTERKEY, ZITADEL_ADMIN_*,
# RUSTFS_*, PDF_KEK, TWENTY_*, FORGEJO_*. See docs/install-server.md.
name: adrient-workspace

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  caddy:
    <<: [*restart, *logging]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WORKSPACE_HOST: ${WORKSPACE_HOST:?set WORKSPACE_HOST}
      AUTH_HOST: ${AUTH_HOST:?set AUTH_HOST}
      CRM_HOST: ${CRM_HOST:-crm.invalid}
      RTC_HOST: ${RTC_HOST:-rtc.invalid}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      CADDY_ACME_CA: ${CADDY_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_SITES_DIR:-./sites}:/etc/caddy/sites:ro
      - ${ADRIENT_DATA_DIR:-./data}/caddy/data:/data
      - ${ADRIENT_DATA_DIR:-./data}/caddy/config:/config
    networks:
      default:
        # Containers resolve the public names to Caddy, so OIDC discovery and
        # the Zitadel API calls work without hairpinning through the internet.
        aliases:
          - ${WORKSPACE_HOST}
          - ${AUTH_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # LiveKit runs on the host network
    # No depends_on: adrient reaches Caddy at startup for OIDC discovery
    # (auth host alias), so Caddy must come up first and proxy lazily.

  postgres:
    <<: [*restart, *logging]
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: adrient
      POSTGRES_DB: adrient
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${ADRIENT_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "adrient", "-d", "adrient"]
      interval: 5s
      timeout: 5s
      retries: 30

  zitadel:
    <<: [*restart, *logging]
    image: ghcr.io/zitadel/zitadel:v2.71.0
    command: start-from-init --masterkeyFromEnv --tlsMode external
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?set ZITADEL_MASTERKEY}
      ZITADEL_EXTERNALDOMAIN: ${AUTH_HOST}
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_PORT: "8080"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: adrient
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: adrient
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Adrient Workspace
      ZITADEL_FIRSTINSTANCE_PATPATH: /data/bootstrap-pat.txt
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Adrient
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ADRIENT_ADMIN_EMAIL:?set ADRIENT_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: Adrient
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: Admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ADRIENT_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?set ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Bootstrap SA
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
    ports:
      # Loopback only: used by install.sh to provision the OIDC app.
      - "127.0.0.1:${ZITADEL_LOCAL_PORT:-18081}:8080"
    volumes:
      - ${ADRIENT_DATA_DIR:-./data}/zitadel:/data
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  rustfs:
    <<: [*restart, *logging]
    image: rustfs/rustfs:1.0.0-beta.7
    # Root so it can write the bind-mounted data dir.
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9100"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    # Loopback only: the egress container (host network) uploads recordings here.
    ports: ["127.0.0.1:9100:9100"]
    volumes:
      - ${ADRIENT_DATA_DIR:-./data}/rustfs:/data

  # One-shot: creates the S3 buckets, retrying until rustfs answers.
  bucket-init:
    image: amazon/aws-cli:2.22.35
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in adrient-default pdf-docs meet-recordings; do
          i=0
          until aws --endpoint-url http://rustfs:9100 s3api head-bucket --bucket "$$b" 2>/dev/null \
             || aws --endpoint-url http://rustfs:9100 s3api create-bucket --bucket "$$b" >/dev/null 2>&1; do
            i=$$((i+1)); [ "$$i" -gt 60 ] && { echo "bucket $$b failed" >&2; exit 1; }
            sleep 2
          done
          echo "bucket $$b ready"
        done
    depends_on:
      - rustfs

  # Meet SFU (LiveKit, Apache-2.0) with built-in TURN. Host networking is what
  # LiveKit recommends: media needs the real IP and a wide UDP range.
  # Open on the firewall: 7881/tcp, 3478/udp, 50000-50999/udp (+80/443 for
  # Caddy). Config + credentials are rendered by install.sh (never in git).
  livekit:
    <<: [*restart, *logging]
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro

  # Redis for LiveKit <-> Egress coordination (loopback only).
  meet-redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command: ["redis-server", "--port", "6390", "--bind", "127.0.0.1", "--save", "", "--appendonly", "no"]
    network_mode: host

  # Meet recording: LiveKit Egress renders the call in headless Chrome and
  # uploads the MP4 to RustFS (bucket meet-recordings, via 127.0.0.1:9100);
  # the backend then copies it into the host's Drive. Config via EGRESS_CONFIG_BODY.
  livekit-egress:
    <<: [*restart, *logging]
    image: livekit/egress:v1.15.0
    network_mode: host
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6390
        health_port: 8089
        log_level: info
    depends_on:
      - livekit
      - meet-redis

  adrient:
    <<: [*restart, *logging]
    image: ${ADRIENT_IMAGE:-adrient-workspace:local}
    build:
      context: ${ADRIENT_SRC_DIR:-../..}
      dockerfile: Dockerfile
      args:
        VITE_CRM_URL: ${ADRIENT_CRM_PUBLIC_URL:-}
        VITE_GIT_URL: ${ADRIENT_GIT_PUBLIC_URL:-}
    command:
      - --http-addr=:8080
      - --grpc-addr=:9000
    environment:
      ADRIENT_POSTGRES_DSN: postgres://adrient:${POSTGRES_PASSWORD}@postgres:5432/adrient?sslmode=disable
      ADRIENT_OIDC_ISSUER: https://${AUTH_HOST}
      ADRIENT_OIDC_CLIENT_ID: ${ADRIENT_OIDC_CLIENT_ID:-}
      ADRIENT_OIDC_CLIENT_SECRET: ${ADRIENT_OIDC_CLIENT_SECRET:-}
      ADRIENT_OIDC_REDIRECT_URL: https://${WORKSPACE_HOST}/api/v1/auth/callback
      ADRIENT_SESSION_COOKIE_NAME: adrient_session
      ADRIENT_SESSION_COOKIE_SECURE: "true"
      ADRIENT_SESSION_COOKIE_DOMAIN: ${WORKSPACE_HOST}
      ADRIENT_SESSION_LIFETIME: 168h
      ADRIENT_DEFAULT_ORG_SLUG: default
      ADRIENT_PUBLIC_BASE_URL: https://${WORKSPACE_HOST}
      ADRIENT_SITE_NAME: Adrient Workspace
      ADRIENT_ADMIN_EMAILS: ${ADRIENT_ADMIN_EMAIL}
      ADRIENT_RUSTFS_ENDPOINT: http://rustfs:9100
      ADRIENT_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      ADRIENT_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      ADRIENT_RUSTFS_BUCKET: adrient-default
      ADRIENT_ZITADEL_API_URL: https://${AUTH_HOST}
      ADRIENT_ZITADEL_SERVICE_TOKEN: ${ADRIENT_ZITADEL_SERVICE_TOKEN:-}
      # Built-in PDF editor & signing (same wiring as deploy/local/stack.sh).
      ADRIENT_PDF_BUILTIN: "true"
      # Meet SFU: the backend mints join tokens and calls the admin API on the
      # host network; browsers connect to wss://rtc.<domain>.
      ADRIENT_LIVEKIT_URL: http://host.docker.internal:7880
      ADRIENT_LIVEKIT_CLIENT_URL: wss://${RTC_HOST:-rtc.invalid}
      ADRIENT_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      ADRIENT_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Recording (Egress): egress writes via the host loopback, the backend reads via the compose network.
      ADRIENT_LIVEKIT_EGRESS: "1"
      ADRIENT_LIVEKIT_EGRESS_S3_ENDPOINT: http://127.0.0.1:9100
      ADRIENT_LIVEKIT_EGRESS_S3_READ_ENDPOINT: http://rustfs:9100
      ADRIENT_LIVEKIT_EGRESS_S3_BUCKET: meet-recordings
      ADRIENT_LIVEKIT_EGRESS_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      ADRIENT_LIVEKIT_EGRESS_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      PDF_DATABASE_URL: postgres://adrient:${POSTGRES_PASSWORD}@postgres:5432/pdf?sslmode=disable
      PDF_STORAGE_ENDPOINT: http://rustfs:9100
      PDF_STORAGE_BUCKET: pdf-docs
      PDF_STORAGE_REGION: us-east-1
      PDF_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      PDF_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      PDF_CRYPTO_KEY_ENCRYPTION_KEY: ${PDF_KEK:?set PDF_KEK}
      # Optional integrations; empty disables the matching proxy.
      ADRIENT_CRM_URL: ${ADRIENT_CRM_URL:-}
      ADRIENT_CRM_HOST: ${ADRIENT_CRM_HOST:-}
      ADRIENT_FORGEJO_URL: ${ADRIENT_FORGEJO_URL:-}
      ADRIENT_FORGEJO_ADMIN_TOKEN: ${ADRIENT_FORGEJO_ADMIN_TOKEN:-}
      ADRIENT_FORGEJO_WEBHOOK_SECRET: ${ADRIENT_FORGEJO_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADRIENT_EMAIL_FROM: ${ADRIENT_EMAIL_FROM:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      zitadel:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started

  # ---- profile: crm (Twenty CRM, served at crm.<domain> through adrient) -----
  twenty-db:
    <<: [*restart, *logging]
    profiles: [crm]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD:-unset}
    volumes:
      - ${ADRIENT_DATA_DIR:-./data}/twenty-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "twenty", "-d", "default"]
      interval: 5s
      timeout: 5s
      retries: 30

  twenty-redis:
    <<: [*restart, *logging]
    profiles: [crm]
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.21.2
    command: ["--port", "6379"]
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6379/metrics >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  twenty-server:
    <<: [*restart, *logging]
    profiles: [crm]
    image: twentycrm/twenty:v2.9.0
    environment: &twenty-env
      NODE_PORT: "3000"
      SERVER_URL: https://${CRM_HOST:-crm.invalid}
      PG_DATABASE_URL: postgres://twenty:${TWENTY_DB_PASSWORD:-unset}@twenty-db:5432/default
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      AUTH_SSO_ENABLED: "true"
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:-unset}
      APP_SECRET: ${TWENTY_APP_SECRET:-unset}
    volumes:
      - ${ADRIENT_DATA_DIR:-./data}/twenty-storage:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 80
      start_period: 30s
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy

  twenty-worker:
    <<: [*restart, *logging]
    profiles: [crm]
    image: twentycrm/twenty:v2.9.0
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - ${ADRIENT_DATA_DIR:-./data}/twenty-storage:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-server:
        condition: service_healthy

  # ---- profile: git (Forgejo, served at <workspace>/git through adrient) -----
  forgejo:
    <<: [*restart, *logging]
    profiles: [git]
    image: codeberg.org/forgejo/forgejo:11
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__DOMAIN: ${WORKSPACE_HOST}
      FORGEJO__server__ROOT_URL: https://${WORKSPACE_HOST}/git/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:-unset}
      # Trust the identity headers adrient sets (the only route to this container).
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: "*"
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_EMAIL: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
    volumes:
      - ${ADRIENT_DATA_DIR:-./data}/forgejo:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  default:
    name: adrient-workspace
