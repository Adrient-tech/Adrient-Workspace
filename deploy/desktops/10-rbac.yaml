# Scoped RBAC: adrient's in-cluster ServiceAccount may manage ONLY the pods,
# services, and PVCs in adrient-desktops — nothing cluster-wide. adrient's k8s REST
# client (internal/desktops/kube.go) uses this via its mounted SA token.
#
# adrient runs under the `default` ServiceAccount in namespace `adrient` (confirmed
# via the adrient deployment); adjust the subject if that changes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adrient-desktops-manager
  namespace: adrient-desktops
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adrient-desktops-manager
  namespace: adrient-desktops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: adrient-desktops-manager
subjects:
  - kind: ServiceAccount
    name: default
    namespace: adrient
