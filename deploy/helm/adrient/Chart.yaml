apiVersion: v2
name: adrient
description: >-
  All-in-one Adrient Workspace platform — bundles Postgres, rustfs (S3), Zitadel
  (OIDC) and the adrient app (with optional bolo-mp sidecar). No external
  operators required; runs on kind, a Raspberry Pi 5 cluster, or a homelab.
type: application
# Chart version — bump on chart changes.
version: 0.4.1
# Default adrient app version installed (overridable via image.tag).
appVersion: "v0.4.0"
keywords:
  - adrient
  - workspace
  - collaboration
  - oidc
  - zitadel
home: https://adrient.com/open-source/adrient-workspace
maintainers:
  - name: Adrient Workspace
sources:
  - https://adrient.com/open-source/adrient-workspace
