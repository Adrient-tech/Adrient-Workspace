# The adrient app: Deployment + Service. Env mirrors the homelab gitops
# deployment, sourced from the bundled (or external) dependencies.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-adrient
  labels:
    {{- include "adrient.labels" . | nindent 4 }}
    app.kubernetes.io/component: adrient
spec:
  type: {{ .Values.adrient.service.type }}
  selector:
    app.kubernetes.io/name: adrient
    app.kubernetes.io/component: adrient
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.adrient.service.httpPort }}
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: {{ .Values.adrient.service.grpcPort }}
      targetPort: 9000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-adrient
  labels:
    {{- include "adrient.labels" . | nindent 4 }}
    app.kubernetes.io/component: adrient
spec:
  replicas: {{ .Values.adrient.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adrient
      app.kubernetes.io/component: adrient
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "adrient.labels" . | nindent 8 }}
        app.kubernetes.io/component: adrient
    spec:
      {{- $pull := include "adrient.pullSecretName" . }}
      {{- if $pull }}
      imagePullSecrets:
        - name: {{ $pull }}
      {{- end }}
      containers:
        - name: adrient
          image: {{ include "adrient.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9000 }
          env:
            - name: ADRIENT_POSTGRES_DSN
              value: {{ include "adrient.pgDSN" . | quote }}
            # --- OIDC ---
            - name: ADRIENT_OIDC_ISSUER
              value: {{ include "adrient.oidcIssuer" . | quote }}
            - name: ADRIENT_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.clientSecretName }}
                  key: client-id
            - name: ADRIENT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.clientSecretName }}
                  key: client-secret
            - name: ADRIENT_OIDC_REDIRECT_URL
              value: {{ include "adrient.oidcRedirectURL" . | quote }}
            # --- session ---
            - name: ADRIENT_SESSION_COOKIE_NAME
              value: {{ .Values.session.cookieName | quote }}
            - name: ADRIENT_SESSION_COOKIE_SECURE
              value: {{ .Values.session.cookieSecure | quote }}
            - name: ADRIENT_SESSION_COOKIE_DOMAIN
              value: {{ .Values.domain | quote }}
            - name: ADRIENT_SESSION_LIFETIME
              value: {{ .Values.session.lifetime | quote }}
            - name: ADRIENT_DEFAULT_ORG_SLUG
              value: {{ .Values.defaultOrgSlug | quote }}
            - name: ADRIENT_ADMIN_EMAILS
              value: {{ .Values.adminEmails | quote }}
            # --- one-click demo login ---
            {{- if .Values.adrient.demo.enabled }}
            - name: ADRIENT_DEMO_LOGIN_ENABLED
              value: "true"
            - name: ADRIENT_DEMO_USERNAME
              value: {{ .Values.adrient.demo.username | quote }}
            {{- if .Values.adrient.demo.password }}
            - name: ADRIENT_DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-demo
                  key: ADRIENT_DEMO_PASSWORD
            {{- end }}
            {{- end }}
            {{- if .Values.zitadel.serviceToken }}
            # Service token so adrient can call the Zitadel user API server-side
            # (required for demo login + in-app password login to function).
            - name: ADRIENT_ZITADEL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-demo
                  key: ADRIENT_ZITADEL_SERVICE_TOKEN
            {{- end }}
            {{- if .Values.adrient.forgejoAdminToken }}
            # Forgejo admin PAT so adrient can auto-provision the Forgejo org +
            # team membership (reverse-proxy SSO org/team auto-create at /git).
            - name: ADRIENT_FORGEJO_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-demo
                  key: ADRIENT_FORGEJO_ADMIN_TOKEN
            {{- end }}
            {{- if eq .Values.auth.mode "bundled" }}
            # In-app user management via the Zitadel User API. When Zitadel
            # advertises an external domain it routes by Host header, so the
            # in-cluster Service URL would be rejected ("Instance not found");
            # use the external issuer URL (browser-reachable) in that case,
            # otherwise the in-cluster Service URL (kind/local).
            - name: ADRIENT_ZITADEL_API_URL
              {{- if .Values.zitadel.externalDomain }}
              value: {{ include "adrient.zitadelExternalURL" . | quote }}
              {{- else }}
              value: {{ include "adrient.zitadelInternalURL" . | quote }}
              {{- end }}
            {{- end }}
            # --- object storage (S3: bundled rustfs, or external) ---
            - name: ADRIENT_RUSTFS_ENDPOINT
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-s3, key: endpoint }
            - name: ADRIENT_RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "adrient.s3CredsSecret" . }}, key: access_key }
            - name: ADRIENT_RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "adrient.s3CredsSecret" . }}, key: secret_key }
            - name: ADRIENT_RUSTFS_BUCKET
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-s3, key: bucket }
            {{- if .Values.pdf.enabled }}
            # --- PDF signing app (built in-process) ---
            - name: ADRIENT_PDF_BUILTIN
              value: "true"
            - name: PDF_DATABASE_URL
              value: {{ include "adrient.pdfDSN" . | quote }}
            - name: PDF_STORAGE_ENDPOINT
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-s3, key: endpoint }
            - name: PDF_STORAGE_BUCKET
              value: {{ .Values.pdf.bucket | quote }}
            - name: PDF_STORAGE_REGION
              value: {{ .Values.pdf.region | quote }}
            - name: PDF_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "adrient.s3CredsSecret" . }}, key: access_key }
            - name: PDF_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "adrient.s3CredsSecret" . }}, key: secret_key }
            - name: PDF_CRYPTO_KEY_ENCRYPTION_KEY
              value: {{ .Values.pdf.kek | quote }}
            {{- end }}
            {{- if .Values.bolo.enabled }}
            # --- bolo-mp sidecar proxy target ---
            - name: ADRIENT_BOLO_MP_URL
              value: "http://127.0.0.1:{{ .Values.bolo.port }}"
            {{- end }}
            {{- with .Values.adrient.libreoffice }}
            {{- if .enabled }}
            # --- optional LibreOffice import (needs an image with soffice) ---
            - name: ADRIENT_LIBREOFFICE
              value: "1"
            {{- if .sofficePath }}
            - name: ADRIENT_SOFFICE_PATH
              value: {{ .sofficePath | quote }}
            {{- end }}
            {{- if .preferODF }}
            - name: ADRIENT_LIBREOFFICE_ODF
              value: "1"
            {{- end }}
            - name: ADRIENT_LIBREOFFICE_CONCURRENCY
              value: {{ .concurrency | default 2 | quote }}
            - name: ADRIENT_LIBREOFFICE_TIMEOUT
              value: {{ .timeout | default "120s" | quote }}
            - name: ADRIENT_LIBREOFFICE_MAX_BYTES
              value: {{ .maxBytes | default 33554432 | int64 | quote }}
            {{- end }}
            {{- end }}
            {{- with (.Values.music | default dict).radioCache }}
            # --- Music radio cache: instance-wide cap (0 = unlimited) ---
            {{- if hasKey . "maxBytes" }}
            - name: ADRIENT_RADIO_CACHE_MAX_BYTES
              value: {{ if kindIs "string" .maxBytes }}{{ .maxBytes | quote }}{{ else }}{{ .maxBytes | int64 | quote }}{{ end }}
            {{- end }}
            {{- if hasKey . "maxDays" }}
            - name: ADRIENT_RADIO_CACHE_MAX_DAYS
              value: {{ .maxDays | int | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.homeAssistant.enabled .Values.homeAssistant.setAdrientDefault }}
            # --- Home Assistant tile default (orgs can override in Admin) ---
            - name: ADRIENT_HOMEASSISTANT_URL
              value: {{ include "adrient.haURL" . | quote }}
            {{- end }}
            {{- with .Values.adrient.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.adrient.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
        {{- if .Values.bolo.enabled }}
        # bolo-mp multiplayer sidecar (authoritative 50Hz Node sim).
        - name: bolo-mp
          image: "{{ .Values.bolo.image.repository }}:{{ .Values.bolo.image.tag }}"
          imagePullPolicy: {{ .Values.bolo.image.pullPolicy }}
          ports:
            - { name: bolo-mp, containerPort: {{ .Values.bolo.port }} }
          env:
            - name: PORT
              value: {{ .Values.bolo.port | quote }}
            - name: ROOM_TTL_MS
              value: {{ .Values.bolo.env.roomTtlMs | quote }}
            - name: MAX_ROOMS
              value: {{ .Values.bolo.env.maxRooms | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.bolo.port }} }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.bolo.port }} }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.bolo.resources | nindent 12 }}
        {{- end }}
