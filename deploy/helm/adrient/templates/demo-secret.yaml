{{- if or .Values.adrient.demo.password .Values.zitadel.serviceToken .Values.adrient.forgejoAdminToken }}
# Secret backing the one-click demo login + adrient's Zitadel service token.
#   ADRIENT_DEMO_PASSWORD       - the demo account's Zitadel password (not read by
#                               adrient, kept here for completeness/rotation).
#   ADRIENT_ZITADEL_SERVICE_TOKEN - PAT adrient uses to call the Zitadel user API
#                               (required for demo login + in-app password login).
# Only created when at least one of the values is set, so non-demo deployments
# carry no extra secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-demo
  labels:
    {{- include "adrient.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo
type: Opaque
stringData:
  {{- if .Values.adrient.demo.password }}
  ADRIENT_DEMO_PASSWORD: {{ .Values.adrient.demo.password | quote }}
  {{- end }}
  {{- if .Values.zitadel.serviceToken }}
  ADRIENT_ZITADEL_SERVICE_TOKEN: {{ .Values.zitadel.serviceToken | quote }}
  {{- end }}
  {{- if .Values.adrient.forgejoAdminToken }}
  ADRIENT_FORGEJO_ADMIN_TOKEN: {{ .Values.adrient.forgejoAdminToken | quote }}
  {{- end }}
{{- end }}
